[project]
name = "policy-updates"
version = "0.1.0"
description = "Policy updates mid-conversation: conversation builder, runner and environment (Task 3)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# GPU box only (Linux + CUDA). vLLM 0.31.0 requires transformers >=5.10.4,<5.18.0.
gpu = [
    "vllm==0.31.0",
    "transformers==5.17.0",
    "huggingface-hub",
]
# Tokenizer-only work (rendering, token counts, weight download) on any machine.
hf = [
    "transformers==5.17.0",
    "huggingface-hub",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff",
]

[project.scripts]
pu = "pu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP042"]  # (str, Enum) kept for explicit .value semantics
